name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'  # <-- ਇੱਥੇ 22 ਕੀਤਾ ਹੈ
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli
        npm install capacitor-unity-ads
        npm install @martinezmanoloa/capacitor-startio-ads
    
    - name: Setup www folder
      run: |
        mkdir -p www
        mv index.html www/ 2>/dev/null || true
        find . -maxdepth 1 -type d \( -name "css" -o -name "js" -o -name "config" -o -name "assets" \) -exec mv {} www/ \; 2>/dev/null || true
    
    - name: Build with Capacitor
      run: |
        npx cap init "Money Mind" "com.ekamgroup.moneymind" --web-dir www --force
        npx cap add android
        npx cap sync android
        cd android
        ./gradlew assembleDebug --warning-mode none
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MoneyMind-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
