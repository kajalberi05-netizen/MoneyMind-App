name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Automatically create www folder and move files
      run: |
        mkdir www
        mv index.html www/
        mv css www/ 2>/dev/null || true
        mv js www/ 2>/dev/null || true
        mv config www/ 2>/dev/null || true
        mv assets www/ 2>/dev/null || true
        mv security www/ 2>/dev/null || true
        sed -i 's/"webDir":.*/"webDir": "www"/' capacitor.config.json

    - name: Install Dependencies
      run: npm install

    - name: Install Capacitor & Plugins
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install capacitor-unity-ads
        npm install @martinezmanoloa/capacitor-startio-ads

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Fix Android SDK Version (Required by Start.io)
      run: |
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoneyMind-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
